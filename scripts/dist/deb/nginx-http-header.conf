pid        /opt/dispatcharr/run/nginx.pid;
error_log  /opt/dispatcharr/data/logs/nginx-error.log warn;

events {
    worker_connections 1024;
}

http {
    include      /opt/dispatcharr/etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log  /opt/dispatcharr/data/logs/nginx-access.log;
    sendfile    on;

    client_body_temp_path /opt/dispatcharr/data/tmp/nginx/client_body;
    proxy_temp_path       /opt/dispatcharr/data/tmp/nginx/proxy;
    fastcgi_temp_path     /opt/dispatcharr/data/tmp/nginx/fastcgi;
    uwsgi_temp_path       /opt/dispatcharr/data/tmp/nginx/uwsgi;
    scgi_temp_path        /opt/dispatcharr/data/tmp/nginx/scgi;

